services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      # Bound to loopback only: Tailscale terminates TLS in front of Actual (see `tailscale serve`),
      # so the container serves plain HTTP and must not occupy the tailnet 0.0.0.0:5006 address.
      - '127.0.0.1:5006:5006'
    # TLS is handled by Tailscale (`tailscale serve --https=5006 http://127.0.0.1:5006`), which
    # auto-renews the *.ts.net Let's Encrypt cert. Actual itself serves plain HTTP.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - ./actual-data:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
